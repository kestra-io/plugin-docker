group: io.kestra.plugin.docker
name: "docker"
title: "Docker"
description: "Docker tasks for building images, running containers, and managing artifacts from Kestra workflows, plus managing AI models through the Docker Model Runner."
body: "The `cli` subgroup requires access to a Docker daemon via host socket or TCP endpoint; the caller inherits daemon permissions, so scope access carefully. Its tasks cover build, image listing, push/pull, tagging, Compose execution, container lifecycle, and pruning. Registry auth is optional and set per task; pass tags, compose files, and run options explicitly. The separate `model` subgroup manages AI models through the Docker Model Runner (DMR) REST API and needs no Docker daemon."
